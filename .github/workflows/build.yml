name: Build ExEditor

on:
  push:
    branches: [main, nsh-edit, rust-nsh]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Validate Windows after CI-only changes without restarting other platform builds'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: exeditor-${{ github.workflow }}-${{ github.ref }}${{ inputs.windows_only && '-windows' || '' }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          New-Item -ItemType Directory -Path logs -Force | Out-Null
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'The Rust toolchain is not pinned.' }
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version | Tee-Object -FilePath logs/toolchain.log
          $installer = Join-Path $env:RUNNER_TEMP 'install-cargo-fork.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/huacnlee/cargo/v0.102.0-9/install.ps1' -OutFile $installer
          & $installer -Version '0.102.0-9'
          Get-Command cargo | Select-Object Source | Out-String | Tee-Object -FilePath logs/toolchain.log -Append
          $cargoVersion = cargo -V
          $cargoVersion | Tee-Object -FilePath logs/toolchain.log -Append
          if ($LASTEXITCODE -ne 0 -or $cargoVersion -notmatch 'huacnlee/cargo 0.102.0-9') { throw 'The configured Cargo fork is not active.' }

      - name: Cache Cargo downloads and compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/targets
            target
          key: windows-2025-cargo-fork-9-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            windows-2025-cargo-fork-9-rust-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Resolve source dependency changes on GitHub
        run: |
          cargo update --workspace 2>&1 | Tee-Object -FilePath logs/lockfile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting
        run: |
          cargo fmt --all -- --check 2>&1 | Tee-Object -FilePath logs/format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Rust diagnostics
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath logs/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache the native proofing package
        id: proofing-cache
        uses: actions/cache@v4
        with:
          path: artifacts/proofing
          key: windows-proofing-v1-${{ hashFiles('scripts/build-proofing-deps.ps1', 'assets/licenses/proofing/**', 'vendor/box-format/**', 'Cargo.lock') }}

      - name: Prepare the native proofing toolchain
        if: steps.proofing-cache.outputs.cache-hit != 'true'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            autoconf
            automake
            libtool
            make
            pkgconf
            autoconf-archive
            python
            git
            curl

      - name: Build the native proofing runtime
        if: steps.proofing-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-proofing-deps.ps1 -Msys2Root '${{ steps.msys2.outputs.msys2-location }}' -Destination artifacts/proofing

      - name: Save the completed native proofing package
        if: steps.proofing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/proofing
          key: windows-proofing-v1-${{ hashFiles('scripts/build-proofing-deps.ps1', 'assets/licenses/proofing/**', 'vendor/box-format/**', 'Cargo.lock') }}

      - name: Run noninteractive Rust tests
        run: |
          $runtime = Join-Path $PWD 'artifacts/proofing'
          cargo test --locked --all-targets --no-run --message-format=json 2>&1 | Tee-Object -FilePath logs/test-artifacts.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExecutables = @(Get-Content logs/test-artifacts.jsonl | Where-Object { $_.StartsWith('{') } | ForEach-Object {
            $artifact = $_ | ConvertFrom-Json
            if ($artifact.reason -eq 'compiler-artifact' -and $artifact.profile.test -and $artifact.executable) { $artifact.executable }
          } | Sort-Object -Unique)
          if ($testExecutables.Count -eq 0) { throw 'Cargo did not report any test executables.' }
          $staged = foreach ($testExecutable in $testExecutables) {
            $testRuntime = Join-Path (Split-Path -Parent $testExecutable) 'proofing'
            New-Item -ItemType Directory -Path $testRuntime -Force | Out-Null
            Copy-Item -Path (Join-Path $runtime '*.dll') -Destination $testRuntime -Force
            Get-ChildItem -LiteralPath $testRuntime -Filter '*.dll' | Select-Object Name,Length,DirectoryName
          }
          Copy-Item -LiteralPath (Join-Path $runtime 'provenance.json') -Destination logs/native-proofing.json
          $staged | ConvertTo-Json | Tee-Object -FilePath logs/test-runtime-files.json
          cargo test --locked --all-targets 2>&1 | Tee-Object -FilePath logs/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check optional font downloads
        run: |
          cargo test --locked accessories::tests::github_font_downloads_are_verified_and_cached -- --ignored 2>&1 | Tee-Object -FilePath logs/accessory-downloads.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check optional dictionary downloads
        run: |
          cargo test --locked dictionaries::tests::github_dictionary_downloads_are_verified_and_cached -- --ignored 2>&1 | Tee-Object -FilePath logs/dictionary-downloads.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the application
        run: |
          cargo build --locked --release --bin exeditor 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check optional fonts are not bundled
        run: |
          python scripts/check-optional-fonts.py target/release/exeditor.exe 2>&1 | Tee-Object -FilePath logs/optional-fonts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the downloadable application
        run: |
          ./scripts/package.ps1 -ReleaseDirectory target/release -Destination artifacts/ExEditor -Commit '${{ github.sha }}'

      - name: Check native Windows startup and Markdown memory
        timeout-minutes: 5
        run: |
          ./scripts/test-windows-native.ps1 -ExecutablePath artifacts/ExEditor/ExEditor.exe
          ./scripts/test-windows-native.ps1 -ExecutablePath artifacts/ExEditor/ExEditor.exe -Appearance Dark -LogDirectory logs/dark -LogDirectory logs

      - name: Build the per-user installer
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          & $compiler "/DAppVersion=$version" "/DAppSource=$((Resolve-Path artifacts/ExEditor).Path)" scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check installer shell integration
        timeout-minutes: 10
        run: |
          ./scripts/test-shell-integration.ps1 -InstallerPath artifacts/installers/ExEditor-Setup-x64.exe -LogDirectory logs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExEditor-installer-windows-x64-${{ github.sha }}
          path: artifacts/installers/ExEditor-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload ExEditor
        uses: actions/upload-artifact@v4
        with:
          name: ExEditor-windows-x64-${{ github.sha }}
          path: artifacts/ExEditor/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExEditor-build-records-${{ github.sha }}
          path: |
            logs/
            Cargo.lock
            artifacts/proofing/*.dll
          if-no-files-found: warn
          retention-days: 14

      - name: Save dependency compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/targets
            target
          key: windows-2025-cargo-fork-9-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.run_id }}


  desktop:
    if: ${{ !inputs.windows_only }}
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64
            target: linux-x64
          - os: macos-15
            label: macOS native
            target: macos-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libatk1.0-dev libatk-bridge2.0-dev libcairo2-dev libdrm-dev libegl1-mesa-dev libgbm-dev libglib2.0-dev libgtk-3-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpango1.0-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev libx11-xcb-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libfontconfig1-dev libfreetype6-dev xvfb
      - name: Install macOS proofing build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config zstd
      - name: Install pinned Rust
        shell: bash
        run: |
          mkdir -p logs
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version | tee logs/toolchain.log
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/huacnlee/cargo/v0.102.0-9/install.sh --output "$RUNNER_TEMP/install-cargo-fork.sh"
          sh "$RUNNER_TEMP/install-cargo-fork.sh" --version 0.102.0-9
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          hash -r
          command -v cargo | tee -a logs/toolchain.log
          cargo -V | tee -a logs/toolchain.log
          cargo -V | grep -F 'huacnlee/cargo 0.102.0-9'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-native-shell-cargo-fork-9
          cache-directories: ~/.cargo/targets
          cache-on-failure: true
      - name: Resolve source dependency changes
        shell: bash
        run: set -o pipefail; cargo update --workspace 2>&1 | tee logs/lockfile.log
      - name: Check formatting
        shell: bash
        run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee logs/format.log
      - name: Check diagnostics
        shell: bash
        run: set -o pipefail; cargo clippy --locked --lib --bin exeditor --all-features -- -D warnings 2>&1 | tee logs/clippy.log
      - name: Build the application
        shell: bash
        run: set -o pipefail; cargo build --locked --release --bin exeditor 2>&1 | tee logs/build.log
      - name: Package native application
        run: python3 scripts/package-desktop.py --target '${{ matrix.target }}' --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ExEditor-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/desktop/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExEditor-build-records-${{ matrix.target }}-${{ github.sha }}
          path: |
            logs/
            Cargo.lock
          retention-days: 14
