[package]
name = "exeditor"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A TextEdit-style native document editor built with Rust and GPUI Kit"
repository = "https://github.com/abelokoj/ExEditor"
license = "MIT"

[dependencies]
anyhow = "1"
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
encoding_rs = "0.8"
csscolorparser = "0.9"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
smol = "2"
unicode-segmentation = "1"
rustybuzz = "0.20.1"
harper-core = { version = "3.0.0", default-features = false }
spellbook = "0.4.2"
divvun-fst = { git = "https://github.com/divvun/divvunspell", rev = "7c3400754ef3f3e39b1c725f0ea18c1acd749b0d", features = ["compression"] }
libloading = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
scraper = "0.24"
rfd = "0.15"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_RichEdit",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
box-format = { path = "vendor/box-format", default-features = false, features = ["writer"] }

[build-dependencies]
embed-resource = "3"

[patch.'https://github.com/bbqsrc/box']
box-format = { path = "vendor/box-format" }
