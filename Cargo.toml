[package]
name = "exeditor"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "A TextEdit-style native document editor built with Rust and Native Shell"
repository = "https://github.com/abelokoj/ExEditor"
license = "MIT"

[dependencies]
anyhow = "1"
ureq = "3.5.1"
sha2 = "0.10"
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false, features = ["rich-editor", "editor", "highlight"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
encoding_rs = "0.8"
csscolorparser = "0.9"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
smol = "2"
unicode-segmentation = "1"
harper-core = { version = "3.0.0", default-features = false }
spellbook = "0.4.2"
divvun-fst = { git = "https://github.com/divvun/divvunspell", rev = "7c3400754ef3f3e39b1c725f0ea18c1acd749b0d", features = ["compression"] }
libloading = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
scraper = "0.24"
rfd = "0.15"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }


# WordCraft codecs are used only for Office/RTF conversion and print output; NSH owns editing.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
wordcraft-docbin = { git = "https://github.com/storytold/wordcraft", rev = "729cd0a5fc953bbedbfdec4f6af18ad6d1780b3b" }
percent-encoding = "2"
url = "2"
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "a3e0b5a9440d18f19422a9dca13516747b7d3181" }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false, features = ["rich-editor", "editor", "highlight"] }
clipboard-win = { version = "5.4", features = ["std"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false, features = ["rich-editor", "editor", "highlight"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false, features = ["rich-editor", "editor", "highlight"] }
wl-clipboard-rs = "0.9"
x11rb = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
box-format = { path = "vendor/box-format", default-features = false, features = ["writer"] }

[build-dependencies]
embed-resource = "3"

[patch.'https://github.com/bbqsrc/box']
box-format = { path = "vendor/box-format" }

# Required by WordCraft’s PDF backend; dependency-workspace patches do not propagate.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
